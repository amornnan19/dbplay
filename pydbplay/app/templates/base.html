<!DOCTYPE html>
<html lang="en" x-data>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}pydbplay{% endblock %}</title>

  <!-- Inline SVG favicon (data-URI) — avoids a /favicon.ico 404 with no asset file -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%236366f1'/><text x='8' y='12' font-size='9' text-anchor='middle' fill='white' font-family='sans-serif'>db</text></svg>" />

  <!-- Tailwind CSS (CDN — dev only; vendor + pin at packaging) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>

  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>

  <!-- Phase-4: embed connection profiles + active conn for tab bar -->
  <script>
    window.__pydbplayProfiles = {{ profiles | tojson if profiles is defined else '[]' }};
    window.__pydbplayActiveConnId = {{ conn_id | tojson if conn_id is defined else 'null' }};
  </script>

  <!-- Phase-5: FOUC prevention — apply dark class before Alpine/CSS loads -->
  <script>
    (function () {
      const stored = localStorage.getItem('pydbplay:theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = stored === 'dark' || ((stored === 'system' || !stored) && prefersDark);
      if (isDark) document.documentElement.classList.add('dark');
    })();
  </script>

  <!-- Phase-4: tabs.js MUST load before alpinejs so its alpine:init listener
       is attached before Alpine fires the event. defer preserves source order. -->
  <script src="/static/js/tabs.js" defer></script>

  <!-- Phase-5: theme.js MUST load before alpinejs for the same reason. -->
  <script src="/static/js/theme.js" defer></script>

  <!-- Alpine.js -->
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- App stylesheet -->
  <link rel="stylesheet" href="/static/css/app.css" />

  {% block head %}{% endblock %}
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 antialiased min-h-screen">

  <!-- Top nav -->
  <header class="bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-700 px-4 py-2 flex items-center gap-4">
    <a href="/connections" class="font-semibold text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-300 flex-shrink-0">
      pydbplay
    </a>
    {% include "partials/tab_bar.html" %}

    <!-- Phase-5: theme toggle (light / dark / system) -->
    <button
      type="button"
      x-data
      @click="$store.theme.cycle()"
      :title="'Theme: ' + $store.theme.value"
      class="ml-auto flex-shrink-0 p-1.5 rounded hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-600 dark:text-gray-400"
      aria-label="Toggle color theme"
    >
      <!-- Sun icon — light mode -->
      <svg x-show="$store.theme.value === 'light'" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 7a5 5 0 100 10 5 5 0 000-10z" />
      </svg>
      <!-- Moon icon — dark mode -->
      <svg x-show="$store.theme.value === 'dark'" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z" />
      </svg>
      <!-- Monitor icon — system mode -->
      <svg x-show="$store.theme.value === 'system'" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
      </svg>
    </button>
  </header>

  <!-- Main content -->
  <main class="p-4">
    {% block content %}{% endblock %}
  </main>

  <!-- App JS -->
  <script type="module" src="/static/js/htmx-ext.js"></script>
  <script src="/static/js/export.js" defer></script>

  {% block scripts %}{% endblock %}
</body>
</html>
