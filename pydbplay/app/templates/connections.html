{% extends "base.html" %}

{% block title %}Connections — pydbplay{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">

  <!-- Header -->
  <div class="flex items-center justify-between">
    <h1 class="text-xl font-semibold">Connections</h1>
    <button
      class="px-3 py-1.5 bg-indigo-600 dark:bg-indigo-500 text-white text-sm rounded hover:bg-indigo-700 dark:hover:bg-indigo-600"
      x-data
      @click="$refs.addForm.classList.toggle('hidden')"
    >+ New Connection</button>
  </div>

  <!-- Add connection form (hidden by default, toggled by Alpine) -->
  <div x-ref="addForm" class="hidden bg-white dark:bg-gray-900 rounded border border-gray-200 dark:border-gray-700 p-4">
    <h2 class="text-sm font-semibold mb-3 text-gray-700 dark:text-gray-300">Add Connection</h2>

    <!-- Test-result slot -->
    <div id="test-result" class="mb-3"></div>

    <form
      hx-post="/api/connections"
      hx-target="#connection-list"
      hx-swap="innerHTML"
      class="space-y-3"
    >
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs text-gray-600 dark:text-gray-400 mb-1">Name *</label>
          <input name="name" required placeholder="My SQLite DB"
            class="w-full border border-gray-300 dark:border-gray-600 rounded px-2 py-1.5 text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-1 focus:ring-indigo-500 dark:focus:ring-indigo-400" />
        </div>
        <div>
          <label class="block text-xs text-gray-600 dark:text-gray-400 mb-1">Engine *</label>
          <select name="engine" required
            class="w-full border border-gray-300 dark:border-gray-600 rounded px-2 py-1.5 text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-1 focus:ring-indigo-500 dark:focus:ring-indigo-400">
            <option value="sqlite">SQLite</option>
            <option value="postgres">PostgreSQL</option>
            <option value="mysql">MySQL</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs text-gray-600 dark:text-gray-400 mb-1">Database / Path *</label>
        <input name="database" required placeholder="/path/to/db.sqlite or database name"
          class="w-full border border-gray-300 dark:border-gray-600 rounded px-2 py-1.5 text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-1 focus:ring-indigo-500 dark:focus:ring-indigo-400" />
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs text-gray-600 dark:text-gray-400 mb-1">Host</label>
          <input name="host" placeholder="localhost"
            class="w-full border border-gray-300 dark:border-gray-600 rounded px-2 py-1.5 text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-1 focus:ring-indigo-500 dark:focus:ring-indigo-400" />
        </div>
        <div>
          <label class="block text-xs text-gray-600 dark:text-gray-400 mb-1">Port</label>
          <input name="port" type="number" placeholder="5432"
            class="w-full border border-gray-300 dark:border-gray-600 rounded px-2 py-1.5 text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-1 focus:ring-indigo-500 dark:focus:ring-indigo-400" />
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs text-gray-600 dark:text-gray-400 mb-1">Username</label>
          <input name="username"
            class="w-full border border-gray-300 dark:border-gray-600 rounded px-2 py-1.5 text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-1 focus:ring-indigo-500 dark:focus:ring-indigo-400" />
        </div>
        <div>
          <label class="block text-xs text-gray-600 dark:text-gray-400 mb-1">Password</label>
          <input name="password" type="password"
            class="w-full border border-gray-300 dark:border-gray-600 rounded px-2 py-1.5 text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-1 focus:ring-indigo-500 dark:focus:ring-indigo-400" />
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs text-gray-600 dark:text-gray-400 mb-1">Color</label>
          <input name="color" type="color" value="#6366f1"
            class="h-8 w-full border border-gray-300 dark:border-gray-600 rounded px-1 text-sm bg-white dark:bg-gray-800" />
        </div>
        <div class="flex items-end">
          <label class="flex items-center gap-2 text-sm text-gray-600 dark:text-gray-400 cursor-pointer">
            <input name="read_only" type="checkbox" value="on" class="rounded" />
            Read-only
          </label>
        </div>
      </div>

      <div class="flex gap-2 pt-1">
        <button type="submit"
          class="px-3 py-1.5 bg-indigo-600 dark:bg-indigo-500 text-white text-sm rounded hover:bg-indigo-700 dark:hover:bg-indigo-600">
          Save
        </button>
        <button type="button"
          hx-post="/api/connections/test"
          hx-include="closest form"
          hx-target="#test-result"
          hx-swap="innerHTML"
          class="px-3 py-1.5 bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 text-sm rounded hover:bg-gray-200 dark:hover:bg-gray-700">
          Test Connection
        </button>
      </div>
    </form>
  </div>

  <!-- Connection list — loaded via HTMX on page load -->
  <div
    id="connection-list"
    hx-get="/api/connections"
    hx-trigger="load"
    hx-swap="innerHTML"
  >
    <p class="text-gray-400 dark:text-gray-500 text-sm">Loading connections&hellip;</p>
  </div>

</div>
{% endblock %}
