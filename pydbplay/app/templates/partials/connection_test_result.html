{% if result.ok %}
<div class="rounded p-3 bg-green-50 dark:bg-green-950/40 border border-green-200 dark:border-green-900 text-green-700 dark:text-green-400 text-sm flex items-center gap-2">
  <span class="font-semibold">&#10003; Success:</span>
  <span>{{ result.message }}</span>
</div>
{% else %}
<div class="rounded p-3 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900 text-red-700 dark:text-red-400 text-sm flex items-center gap-2">
  <span class="font-semibold">&#10007; Failed:</span>
  <span>{{ result.message }}</span>
</div>
{% endif %}
