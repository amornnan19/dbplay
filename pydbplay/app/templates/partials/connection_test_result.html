{% if result.ok %}
<div class="rounded p-3 bg-green-50 border border-green-200 text-green-700 text-sm flex items-center gap-2">
  <span class="font-semibold">&#10003; Success:</span>
  <span>{{ result.message }}</span>
</div>
{% else %}
<div class="rounded p-3 bg-red-50 border border-red-200 text-red-700 text-sm flex items-center gap-2">
  <span class="font-semibold">&#10007; Failed:</span>
  <span>{{ result.message }}</span>
</div>
{% endif %}
