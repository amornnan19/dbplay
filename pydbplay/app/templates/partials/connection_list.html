{% if connections %}
<ul class="divide-y divide-gray-200 dark:divide-gray-700 bg-white dark:bg-gray-900 rounded border border-gray-200 dark:border-gray-700">
  {% for conn in connections %}
  <li class="flex items-center gap-3 px-4 py-3" id="conn-{{ conn.id }}">
    {% if conn.color %}
    <span class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background:{{ conn.color }}"></span>
    {% else %}
    <span class="w-2.5 h-2.5 rounded-full flex-shrink-0 bg-gray-300 dark:bg-gray-600"></span>
    {% endif %}

    <div class="flex-1 min-w-0">
      <span class="font-medium truncate block">{{ conn.name }}</span>
      <span class="text-xs text-gray-500 dark:text-gray-500">{{ conn.engine }} &middot; {{ conn.database }}</span>
      {% if conn.read_only %}
      <span class="ml-1 text-xs text-amber-600 dark:text-amber-400 font-medium">read-only</span>
      {% endif %}
    </div>

    <div class="flex items-center gap-2 flex-shrink-0">
      <button
        class="px-2 py-1 text-xs bg-indigo-600 dark:bg-indigo-500 text-white rounded hover:bg-indigo-700 dark:hover:bg-indigo-600"
        hx-post="/api/connections/{{ conn.id }}/connect"
        hx-target="#connection-list"
        hx-swap="innerHTML"
      >Connect</button>

      <button
        class="px-2 py-1 text-xs bg-red-100 dark:bg-red-950/40 text-red-700 dark:text-red-400 rounded hover:bg-red-200 dark:hover:bg-red-900/50"
        hx-delete="/api/connections/{{ conn.id }}"
        hx-target="#conn-{{ conn.id }}"
        hx-swap="outerHTML"
        hx-confirm="Delete connection '{{ conn.name }}'?"
      >Delete</button>
    </div>
  </li>
  {% endfor %}
</ul>
{% else %}
<p class="text-gray-500 dark:text-gray-400 text-sm py-4" id="connection-empty-state">
  No connections yet. Add one to get started.
</p>
{% endif %}
