repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.13.4
          - pydantic-settings>=2.14.1
          - fastapi>=0.136.3
          - sqlalchemy>=2.0.50
          - sqlglot>=30.8.0
        args: [--ignore-missing-imports]
